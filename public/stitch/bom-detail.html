function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function render() {
  const id = getParam('id') || 'mctrl';
  const bom = BOMS[id];
  if (!bom) { document.body.innerHTML = '<p style="padding:2rem">BOM not found.</p>'; return; }

  document.title = bom.name + ' | Kitted';
  document.getElementById('header-name').textContent = bom.name;
  document.getElementById('info-name').textContent = bom.name;
  document.getElementById('info-parts').textContent = bom.parts + ' line items';
  document.getElementById('info-cost').textContent = bom.cost;
  document.getElementById('info-dist').textContent = bom.distributors;
  document.getElementById('info-modified').textContent = bom.modified;

  const statusEl = document.getElementById('info-status');
  if (bom.status === 'optimized') {
    statusEl.innerHTML = '<span class="status-chip" style="background:#dcfce7;color:#166534;">✓ Optimized</span>';
  } else {
    statusEl.innerHTML = '<span class="status-chip" style="background:#f1f5f9;color:#64748b;">Draft</span>';
  }

  const tbody = document.getElementById('parts-tbody');
  tbody.innerHTML = bom.rows.map((r, i) => {
    const ext = r.unit != null ? '$' + (r.qty * r.unit).toFixed(2) : '—';
    const unitStr = r.unit != null ? '$' + r.unit.toFixed(3) : '—';
    const stockColor = r.lead === 'In Stock' ? 'color:#166534;' : r.lead === '—' ? 'color:#94a3b8;' : 'color:#92400e;';
    const pUrl = partUrl(r.dist, r.mpn);
    const nameCell = pUrl
      ? `<a href="${pUrl}" target="_blank" rel="noopener" class="text-primary hover:underline font-semibold">${r.name}</a>`
      : `<span class="font-semibold text-on-surface-variant">${r.name}</span>`;
    const distHome = DIST_HOME[r.dist];
    const distCell = distHome
      ? `<a href="${distHome}" target="_blank" rel="noopener" class="text-on-surface hover:text-primary hover:underline transition-colors">${r.dist}</a>`
      : `<span class="text-on-surface-variant">${r.dist}</span>`;
    return `<tr class="hover:bg-surface-container-low transition-colors part-row">
      <td class="px-md py-sm font-label-mono text-label-mono text-outline">${String(i+1).padStart(2,'0')}</td>
      <td class="px-md py-sm font-body-sm text-body-sm">${nameCell}</td>
      <td class="px-md py-sm font-label-mono text-label-mono text-on-surface-variant">${r.mpn}</td>
      <td class="px-md py-sm font-body-sm text-body-sm text-on-surface-variant">${r.mfr}</td>
      <td class="px-md py-sm font-body-sm text-body-sm">${distCell}</td>
      <td class="px-md py-sm font-label-mono text-label-mono text-on-surface text-right">${r.qty}</td>
      <td class="px-md py-sm font-label-mono text-label-mono text-on-surface text-right">${unitStr}</td>
      <td class="px-md py-sm font-label-mono text-label-mono text-primary font-semibold text-right">${ext}</td>
      <td class="px-md py-sm font-body-sm text-body-sm" style="${stockColor}">${r.lead}</td>
    </tr>`;
  }).join('');

  updateCount();
}

function filterParts() {
  const q = document.getElementById('part-search').value.toLowerCase();
  document.querySelectorAll('.part-row').forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
  updateCount();
}

function updateCount() {
  const visible = [...document.querySelectorAll('.part-row')].filter(r => r.style.display !== 'none').length;
  document.getElementById('part-count').textContent = visible + ' parts shown';
}

document.getElementById('btn-export').addEventListener('click', () => {
  const headers = [...document.querySelectorAll('thead th')].map(th => th.textContent.trim());
  const rows = [...document.querySelectorAll('.part-row')].map(row =>
    [...row.querySelectorAll('td')].map(td => {
      const v = td.textContent.trim().replace(/"/g, '""');
      return `"${v}"`;
    }).join(',')
  );
  const csv = [headers.map(h => `"${h}"`).join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  const name = document.querySelector('h1,h2,.bom-name')?.textContent.trim().replace(/\s+/g,'_') || 'bom';
  a.download = name + '.csv';
  a.click();
  showToast('BOM exported as CSV');
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2200);
}

render();
</script>
